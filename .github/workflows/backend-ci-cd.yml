name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for AWS OIDC authentication

jobs:
  test:
    name: Test & Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check bytecode compilation
        run: |
          python -m compileall -q app jobs tests parsers

      - name: Run Pytest test suite
        run: |
          pytest -v

  build-and-push:
    name: Build & Push Docker Image to Amazon ECR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ github.sha }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::349558247779:role/github-actions-cardboarddex-deploy
          aws-region: us-west-2
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cardboarddex-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cardboarddex-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-migrations:
    name: Run Database Migrations (Alembic)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::349558247779:role/github-actions-cardboarddex-deploy
          aws-region: us-west-2
          audience: sts.amazonaws.com

      - name: Run Alembic migration task on ECS
        run: |
          CLUSTER="default"
          MIGRATION_TASK_FAMILY="cardboarddex-migration"
          SUBNETS="${{ vars.ECS_SUBNET_IDS }}"
          SECURITY_GROUPS="${{ vars.ECS_SECURITY_GROUP_IDS }}"

          if [ -z "$SUBNETS" ]; then
            echo "Notice: ECS_SUBNET_IDS not configured. Skipping automated migration task run."
            echo "Run migrations manually or configure repository variables."
            exit 0
          fi

          echo "Triggering one-off ECS Fargate migration task..."
          aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$MIGRATION_TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\": [{\"name\": \"migration\", \"command\": [\"alembic\", \"upgrade\", \"head\"]}]}"

  deploy:
    name: Deploy to Amazon ECS Fargate
    needs: [build-and-push, run-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::349558247779:role/github-actions-cardboarddex-deploy
          aws-region: us-west-2
          audience: sts.amazonaws.com

      - name: Deploy API and Celery services
        run: |
          CLUSTER="default"
          API_SERVICE="cardboarddex-api-tunnel-service"
          WORKER_SERVICE="cardboarddex-celery-worker-service-51wjzn39"

          echo "Updating FastAPI Tunnel Service: $API_SERVICE..."
          aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API_SERVICE"

          echo "Updating Celery Worker Service: $WORKER_SERVICE..."
          aws ecs update-service --cluster "$CLUSTER" --service "$WORKER_SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$WORKER_SERVICE"

          curl --fail --silent --show-error --retry 5 --retry-delay 10 https://api.cardboarddex.app/health
          echo "Deployment verified successfully."
